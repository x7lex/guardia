appId: org.guardia.desktop
productName: Guardia
asar: true
files:
  - electron/main.mjs
  - package.json
  - "!node_modules/**/*"
extraResources:
  - from: ../../../dist/scanner/guardia-scanner
    to: scanner
  - from: .next/standalone
    to: web
    filter:
      - '**/*'
      - '!**/.env'
      - '!**/.env.*'
  - from: .next/standalone/node_modules
    to: web/node_modules
    filter: ["**/*"]
  # Next rebuilds standalone/ without these assets. Copy from their canonical
  # locations so a direct electron-builder invocation cannot ship an unstyled UI.
  - from: public
    to: web/public
    filter: ["**/*"]
  - from: .next/static
    to: web/.next/static
    filter: ["**/*"]
directories:
  output: ../../../dist/desktop
mac:
  identity: null
  target: [dir, dmg]
  category: public.app-category.utilities
win:
  target: nsis
linux:
  target: AppImage
